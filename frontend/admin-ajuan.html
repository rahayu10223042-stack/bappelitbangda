<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Ajuan — Bappelitbangda Kabupaten Tasikmalaya</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="admin-body">

<header class="admin-topbar">
  <div class="container admin-topbar-inner">
    <a class="brand" href="admin.html">
      <div class="header-logo-group">
        <img src="images/logo-kabupaten.png" alt="Logo Kabupaten Tasikmalaya">
        <img src="images/logo-bappelitbangda.png" alt="Logo Bappelitbangda Kabupaten Tasikmalaya">
        <img src="images/logo-berakhlak.png" alt="BerAKHLAK">
        <img src="images/logo-bangga-melayani.png" alt="Bangga Melayani Bangsa">
      </div>
    </a>

        <div class="admin-menu" style="margin-left:auto;">
      <button class="admin-menu-toggle" id="adminMenuToggle" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="adminAvatar">A</span>
        <span class="admin-menu-label">
          <span class="uname" id="adminName">Admin</span>
          <span class="urole">Petugas Layanan</span>
        </span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="admin-menu-dropdown" id="adminMenuDropdown">
        <a href="admin.html">Dashboard</a>
        <a href="admin-ajuan.html" class="active">Data Ajuan</a>
        <a href="admin-penelitian.html">Data Penelitian</a>
        <a href="admin-permohonan.html">Data Permohonan Informasi</a>
        <a href="admin-konsultasi-pengaduan.html">Konsultasi &amp; Pengaduan</a>
        <a href="admin-ganti-password.html">Ganti Password</a>
        <div class="admin-menu-divider"></div>
        <button type="button" id="logoutBtn" class="admin-menu-logout">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Keluar
        </button>
      </div>
    </div>
  </div>
</header>

<main class="admin-main">
  <div class="container">

    <div class="admin-head">
      <div>
        <h1>Daftar Ajuan Magang &amp; PKL</h1>
        <p>Kelola dan perbarui status setiap ajuan yang masuk.</p>
      </div>
    </div>

    <div class="filter-bar">
      <input type="search" id="searchInput" placeholder="Cari nama, NIM, atau nomor tiket...">
      <select id="statusFilter">
        <option value="">Semua Status</option>
        <option value="Menunggu Verifikasi">Menunggu Verifikasi</option>
        <option value="Diverifikasi">Diverifikasi</option>
        <option value="Ditolak">Ditolak</option>
        <option value="Selesai">Selesai</option>
      </select>
      <select id="jenisFilter">
        <option value="">Semua Jenis</option>
        <option value="Magang">Magang</option>
        <option value="PKL">PKL</option>
      </select>
      <span class="count-badge" id="countBadge">0 ajuan</span>

      <button type="button" id="exportExcelBtn" class="btn-export-excel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="3" y1="15" x2="21" y2="15"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
        Unduh Excel
      </button>
    </div>

    <div class="table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Tiket</th><th>Pemohon</th><th>Jenis</th><th>Bidang</th>
            <th>Periode</th><th>Status</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Baris diisi otomatis oleh admin-ajuan.js -->
        </tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <p>Belum ada ajuan yang cocok dengan filter ini.</p>
      </div>
    </div>

    <div id="pager" class="pager-row"></div>

  </div>
</main>

<div class="toast" id="toast" role="alert"></div>

<script src="admin-common.js"></script>
<script src="admin-ajuan.js"></script>
</body>
</html>
