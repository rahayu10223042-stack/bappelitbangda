<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganti Password — Bappelitbangda Kabupaten Tasikmalaya</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

<header class="admin-topbar">
  <div class="container admin-topbar-inner">
    <a class="brand" href="admin.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20V13" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 20V9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 20V5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 9L10 5L16 5L20.5 2.5" stroke="#F0A63F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 2.5H20.5V6" stroke="#F0A63F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title" style="display:block;">BAPPELITBANGDA</span>
        <span class="brand-sub">Panel Admin</span>
      </span>
    </a>

    <div class="admin-user" style="margin-left:auto;">
      <span class="avatar" id="adminAvatar">A</span>
      <div>
        <div class="uname" id="adminName">Admin</div>
        <div class="urole">Petugas Layanan</div>
      </div>
      <button class="btn-logout" id="logoutBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Keluar
      </button>
    </div>
  </div>
</header>

<main class="admin-main">
  <div class="container" style="max-width:520px;">

    <div class="admin-head">
      <div>
        <h1>Ganti Password</h1>
        <p>Ubah password akun admin Anda sendiri.</p>
      </div>
    </div>

    <div class="form-shell">
      <div class="login-error" id="changeError" role="alert" style="margin-bottom:16px;"></div>
      <div class="result-panel show" id="changeSuccess" style="display:none; margin-bottom:16px;">
        Password berhasil diubah. Anda akan diarahkan untuk login ulang dalam beberapa detik...
      </div>

      <form id="changePasswordForm" novalidate>
        <div class="field" style="margin-bottom:16px;">
          <label for="oldPassword">Password Lama</label>
          <input type="password" id="oldPassword" name="oldPassword" required autocomplete="current-password">
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label for="newPassword">Password Baru</label>
          <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" minlength="8">
          <span class="hint">Minimal 8 karakter.</span>
        </div>
        <div class="field" style="margin-bottom:20px;">
          <label for="confirmPassword">Ulangi Password Baru</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" minlength="8">
        </div>

        <button type="submit" class="btn btn-solid" style="width:100%;">Simpan Password Baru</button>
      </form>
    </div>

  </div>
</main>

<div class="toast" id="toast" role="alert"></div>

<script src="admin-common.js"></script>
<script src="admin-ganti-password.js"></script>
</body>
</html>
