<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — Bappelitbangda Kabupaten Tasikmalaya</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="login-card">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20V13" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 20V9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 20V5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 9L10 5L16 5L20.5 2.5" stroke="#F0A63F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 2.5H20.5V6" stroke="#F0A63F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-title" style="display:block;">BAPPELITBANGDA</span>
        <span class="brand-sub">Kab. Tasikmalaya</span>
      </span>
    </a>
    <h1>Login Admin</h1>
    <p class="sub">Masuk dengan akun admin untuk mengelola ajuan magang &amp; PKL.</p>

    <div class="login-error" id="loginError" role="alert"></div>

    <form id="adminLoginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Masukkan username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Masukkan password">
      </div>
      <button type="submit" class="btn btn-solid">Masuk</button>
    </form>

    <a class="back-to-site" href="index.html">&larr; Kembali ke situs utama</a>
  </div>
</div>

<div class="toast" id="toast" role="alert"></div>

<script src="admin-common.js"></script>
</body>
</html>
